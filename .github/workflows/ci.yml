name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: lint and test
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
          cache: pip

      # torch and sentence-transformers are left out on purpose: the tests mock the model.
      - name: Install
        run: pip install fastapi==0.141.1 pydantic==2.13.4 -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest
